<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>
<body>
    <header>
        <div class="logo_container">
            <a href="#"><img class="myntra_home" src="images/mytra.webp" alt="Myntra Home"></a>
        </div>
        <nav class = "nav_bar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio <sup>New</sup></a>
        </nav>
        <div class="search_bar"><span class="material-symbols-outlined search_icon">search</span>
        <input type="search" placeholder="Search for products, brands and more"></div>
        <div class="action_bar">
            <div class="action_container">
                <span class="material-symbols-outlined">person</span>
                <span class="action_name">Profile</span>
            </div>
            <div class="action_container">
                <span class="material-symbols-outlined">favorite</span>
                <span class="action_name">Wishlist</span>
            </div>
            <div class="action_container">
                <span class="material-symbols-outlined">shopping_bag</span>                
                <span class="action_name">Bag</span> 
            </div>
        </div>
    </header>
    <main>
        <div class="banner_container">
        <img src="Feature-Image.jpg" alt="Main Banner">
         </div>
        <div class="category_heading">MEDAL WORTHY BRANDS </div>
        <div class="category_items">
            <a href="#"><img class="sale_items" src="OIP.webp" ></a>
            <a href="#"><img class="sale_items" src="pngtree-creative-special-offer-banner-shape-tag-png-image_8922232.png" ></a>
            <a href="#"><img class="sale_items" src="Special-offer-Deal-Transparent-Background.png" ></a>
        </div>
        <div class="category_heading">SHOP BY CATEGORY</div>
        <div class="category_items">
            
        </div>
    </main>
    <footer> </footer>
</body>
</html>
